# SPDX-License-Identifier: LGPL-2.1-or-later
# Copied from AudioCaps v1.0.0 (commit 049d053) crates/audiocaps-ffi/cbindgen.toml; renamed for
# DisplayCaps. Generates include/displaycaps.h:
# cbindgen --config crates/displaycaps-ffi/cbindgen.toml --crate displaycaps-ffi
language = "C"
header = "/* SPDX-License-Identifier: LGPL-2.1-or-later */\n/* DisplayCaps C API. Generated by cbindgen from crates/displaycaps-ffi; do not edit. */"
include_guard = "DISPLAYCAPS_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true

[export]
include = ["DcWatchCallback"]

[export.rename]
"DcContext" = "dc_context"
"DcSnapshot" = "dc_snapshot"
"DcWatch" = "dc_watch"
"DcWatchCallback" = "dc_watch_callback"

[enum]
prefix_with_name = true
